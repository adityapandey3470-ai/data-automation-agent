
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    accept-count: 100
    connection-timeout: 20s

spring:
  application:
    name: data-automation-agent
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms


  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:tabufinery}}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 5000
      max-lifetime: 1800000
      leak-detection-threshold: 20000


  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false


  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}


  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB


management:
  health:
    redis:
      enabled: ${RATE_LIMIT_REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: false

info:
  app:
    name: data-automation-agent
    description: AI Business Automation Platform
    version: 0.0.1-SNAPSHOT


springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    operationsSorter: method


app:
  security:
    behind-proxy: ${APP_BEHIND_PROXY:false}
    trusted-proxies: ${APP_TRUSTED_PROXIES:127.0.0.1,::1}
  file:
    max-size: 10485760
  excel:
    preview-rows: 10
    max-sheets: 50
    max-uncompressed-bytes: 157286400
    max-concurrent-parses: 2
  rate-limit:
    redis-enabled: ${RATE_LIMIT_REDIS_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    expose-dev-token: ${EXPOSE_DEV_RESET_TOKEN:false}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
  admin:
    email: ${APP_ADMIN_EMAIL}
    password: ${APP_ADMIN_PASSWORD}
    name: ${APP_ADMIN_NAME}
  mail:
    host: ${SMTP_HOST:${spring.mail.host:}}
    port: ${SMTP_PORT:${spring.mail.port:587}}
    username: ${SMTP_USERNAME:${spring.mail.username:}}
    password: ${SMTP_PASSWORD:${spring.mail.password:}}
    from: ${APP_MAIL_FROM:noreply@tabufinery.io}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      timeout-seconds: 15
