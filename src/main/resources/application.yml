
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: data-automation-agent


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/data_automation}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000


  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false


  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true


  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: data-automation-agent
    description: AI Business Automation Platform
    version: 0.0.1-SNAPSHOT


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method


app:
  file:
    max-size: 10485760
  excel:
    preview-rows: 10
