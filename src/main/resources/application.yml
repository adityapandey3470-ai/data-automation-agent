
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: data-automation-agent


  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/tabufinery;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      leak-detection-threshold: 20000


  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false


  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false


  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: false

info:
  app:
    name: data-automation-agent
    description: AI Business Automation Platform
    version: 0.0.1-SNAPSHOT


springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
    operationsSorter: method


app:
  security:
    behind-proxy: ${APP_BEHIND_PROXY:false}
    trusted-proxies: ${APP_TRUSTED_PROXIES:127.0.0.1,::1}
  file:
    max-size: 10485760
  excel:
    preview-rows: 10
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS:72}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://192.168.29.46:5173}
  auth:
    expose-dev-token: ${EXPOSE_DEV_RESET_TOKEN:false}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  admin:
    email: ${APP_ADMIN_EMAIL}
    password: ${APP_ADMIN_PASSWORD}
    name: ${APP_ADMIN_NAME}
  mail:
    host: ${SMTP_HOST:${spring.mail.host:}}
    port: ${SMTP_PORT:${spring.mail.port:587}}
    username: ${SMTP_USERNAME:${spring.mail.username:}}
    password: ${SMTP_PASSWORD:${spring.mail.password:}}
    from: ${APP_MAIL_FROM:noreply@tabufinery.io}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      timeout-seconds: 15
